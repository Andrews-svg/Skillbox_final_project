services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: search_engine
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

  selenium:
    image: selenium/standalone-chrome:4.29.0
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    image: searchengine:local
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/search_engine?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Moscow&useLegacyDatetimeCode=false
      DB_USER: root
      DB_PASS: root
      SELENIUM_REMOTE_URL: http://selenium:4444
    depends_on:
      mysql:
        condition: service_healthy
      selenium:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  mysql-data: