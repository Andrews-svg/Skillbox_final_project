<div class="Section">
    <div class="Section-header">
        <h2 class="Section-title">Management</h2>
    </div>

    <!-- Управление индексацией -->
    <div class="card">
        <div class="card-title">
            <i class="fas fa-play-circle"></i>
            <span>Управление процессом индексации</span>
        </div>

        <!-- Индикатор-светофор -->
        <div class="indexing-indicator">
            <span class="indicator-light red active" id="indicatorRed"></span>
            <span class="indicator-light green" id="indicatorGreen"></span>
            <span class="indicator-label" id="indicatorLabel">Индексация не выполняется</span>
        </div>

        <div class="management-controls">
            <button class="btn btn-success" id="startIndexingBtn" data-send="startIndexing">
                <i class="fas fa-play"></i> START INDEXING
            </button>
            <button class="btn btn-danger" id="stopIndexingBtn" data-send="stopIndexing" disabled>
                <i class="fas fa-stop"></i> STOP INDEXING
            </button>
        </div>
    </div>

    <!-- Добавление отдельной страницы -->
    <div class="card">
        <div class="card-title">
            <i class="fas fa-plus-circle"></i>
            <span>Добавить или обновить страницу</span>
        </div>
        <div class="url-input-group">
            <input type="url" class="form-control" id="pageUrl" placeholder="https://example.com/page">
            <button class="btn btn-primary" id="indexPageBtn" data-send="indexPage">
                <i class="fas fa-plus"></i> ADD PAGE
            </button>
        </div>
    </div>

    <div id="managementResult" class="global-alert" style="display: none;"></div>
</div>
