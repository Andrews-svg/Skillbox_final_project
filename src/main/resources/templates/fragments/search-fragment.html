<div class="Section">
    <div class="Section-header">
        <h2 class="Section-title">Search</h2>
    </div>

    <!-- Форма поиска -->
    <div class="card">
        <div class="search-controls">
            <div class="search-input-group">
                <input type="text" class="form-control" id="searchQuery" placeholder="Введите поисковый запрос...">
                <select class="form-select" id="searchSite" style="width: 200px;">
                    <option value="">Все сайты</option>
                </select>
            </div>
            <button class="btn btn-primary" id="searchBtn">
                <i class="fas fa-search"></i> НАЙТИ
            </button>
        </div>
    </div>

    <!-- Результаты поиска -->
    <div id="searchResults" class="search-results">
        <div class="search-result-placeholder" style="text-align: center; padding: 40px; color: #718096;">
            <i class="fas fa-search" style="font-size: 48px; margin-bottom: 15px;"></i>
            <p>Введите запрос и нажмите "Найти"</p>
        </div>
    </div>
</div>

<script>
    (function() {
        const backendUrl = window.backendApiUrl || '/api';
        let currentOffset = 0;
        let currentQuery = '';
        let currentSite = '';
        const limit = 20;

        function loadSites() {
            fetch(backendUrl + '/statistics')
                .then(response => response.json())
                .then(data => {
                    if (data.result && data.statistics && data.statistics.detailed) {
                        const select = document.getElementById('searchSite');
                        select.innerHTML = '<option value="">Все сайты</option>';
                        data.statistics.detailed.forEach(site => {
                            const option = document.createElement('option');
                            option.value = site.url;
                            option.textContent = site.name || site.url;
                            select.appendChild(option);
                        });
                    }
                })
                .catch(err => console.error('Load sites error:', err));
        }

        function displaySearchResults(response) {
            const container = document.getElementById('searchResults');
            if (!response.result || !response.data || response.data.length === 0) {
                container.innerHTML = `
                    <div class="search-result-placeholder" style="text-align: center; padding: 40px; color: #718096;">
                        <i class="fas fa-search" style="font-size: 48px; margin-bottom: 15px;"></i>
                        <p>${response.error || 'Ничего не найдено'}</p>
                    </div>
                `;
                return;
            }

            let html = `<h3>Найдено страниц: ${response.count || 0}</h3>`;
            response.data.forEach(item => {
                html += `
                    <div class="search-result-item">
                        <div class="search-result-title">${item.title || 'Без заголовка'}</div>
                        <div class="search-result-url">${item.site || ''}${item.uri || ''}</div>
                        <div class="search-result-snippet">${item.snippet || ''}</div>
                        <div><span class="relevance-badge">релевантность: ${(item.relevance || 0).toFixed(4)}</span></div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function performSearch(resetOffset = true) {
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) {
                document.getElementById('searchResults').innerHTML = `
                    <div class="search-result-placeholder" style="text-align: center; padding: 40px; color: #718096;">
                        <i class="fas fa-search" style="font-size: 48px; margin-bottom: 15px;"></i>
                        <p>Введите поисковый запрос</p>
                    </div>
                `;
                return;
            }

            if (resetOffset) {
                currentOffset = 0;
            }

            currentQuery = query;
            currentSite = document.getElementById('searchSite').value;

            let url = `${backendUrl}/search?query=${encodeURIComponent(currentQuery)}&offset=${currentOffset}&limit=${limit}`;
            if (currentSite) {
                url += `&site=${encodeURIComponent(currentSite)}`;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (resetOffset) {
                        displaySearchResults(data);
                    } else {
                        // Для пагинации (если потребуется)
                        if (data.result && data.data) {
                            const container = document.getElementById('searchResults');
                            data.data.forEach(item => {
                                const itemHtml = `
                                    <div class="search-result-item">
                                        <div class="search-result-title">${item.title || 'Без заголовка'}</div>
                                        <div class="search-result-url">${item.site || ''}${item.uri || ''}</div>
                                        <div class="search-result-snippet">${item.snippet || ''}</div>
                                        <div><span class="relevance-badge">релевантность: ${(item.relevance || 0).toFixed(4)}</span></div>
                                    </div>
                                `;
                                container.insertAdjacentHTML('beforeend', itemHtml);
                            });
                        }
                    }
                })
                .catch(err => {
                    console.error('Search error:', err);
                    document.getElementById('searchResults').innerHTML = `
                        <div class="alert alert-error">Ошибка соединения с сервером</div>
                    `;
                });
        }

        document.getElementById('searchBtn')?.addEventListener('click', () => performSearch(true));
        document.getElementById('searchQuery')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch(true);
        });

        loadSites();
    })();
</script>
