<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .auth-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .auth-header i {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .auth-header h2 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }
        .auth-header p {
            margin: 10px 0 0;
            opacity: 0.9;
        }
        .auth-body {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group > label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .form-group > label i {
            margin-right: 5px;
            color: #667eea;
        }
        .password_input_container {
            position: relative;
            display: block;
            width: 100%;
        }
        .password_input_container input {
            outline: none;
            font-size: 16px;
            padding: 12px 15px;
            width: 100%;
            background-color: #fff;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            color: #333;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .password_input_container input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .password_input_container input.is-invalid {
            border-color: #dc3545;
        }
        .password_input_container button {
            cursor: pointer;
            position: absolute;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            top: 0;
            right: 0;
            background: transparent;
            border: none;
            padding: 0 15px;
            z-index: 10;
            color: #667eea;
        }
        .password_input_container button:hover {
            opacity: 0.8;
        }
        .invalid-feedback {
            display: none;
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            padding-left: 15px;
        }
        .btn {
            display: inline-block;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 10px;
            transition: all 0.3s ease;
            border: none;
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .btn i {
            margin-right: 8px;
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e1e1e1;
        }
        .auth-footer p {
            color: #6c757d;
            margin: 0;
        }
        .auth-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .global-alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .global-alert.error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .global-alert.success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-plus"></i>
            <h2>Регистрация</h2>
            <p>Создайте новый аккаунт</p>
        </div>
        <div class="auth-body">
            <div class="global-alert" id="regAlert" style="display: none;"></div>
            <form id="registrationForm">
                <div class="form-group">
                    <label><i class="fas fa-user-tag"></i> Имя пользователя *</label>
                    <input type="text" name="username" id="reg-username" class="form-control" placeholder="ivan123" minlength="3" maxlength="50" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Фамилия *</label>
                    <input type="text" name="lastName" id="lastName" class="form-control" placeholder="Иванов" maxlength="50" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email *</label>
                    <input type="email" name="email" id="email" class="form-control" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-key"></i> Пароль *</label>
                    <div class="password_input_container">
                        <input type="password" id="reg-password" name="password" minlength="8" maxlength="20" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn"><i class="fas fa-eye-slash"></i></button>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-key"></i> Подтверждение пароля *</label>
                    <div class="password_input_container">
                        <input type="password" id="reg-confirm" name="confirmPassword" minlength="8" maxlength="20" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn"><i class="fas fa-eye-slash"></i></button>
                    </div>
                    <div class="invalid-feedback" id="password-match-error"></div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-user-check"></i> Зарегистрироваться
                </button>
            </form>
            <div class="auth-footer">
                <p>Уже есть аккаунт? <a href="#" onclick="App.switchTab('login'); return false;">Войти</a></p>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        function showAlert(message, type) {
            const alertDiv = document.getElementById('regAlert');
            if (alertDiv) {
                alertDiv.textContent = message;
                alertDiv.className = 'global-alert ' + type;
                alertDiv.style.display = 'block';
                setTimeout(() => { alertDiv.style.display = 'none'; }, 5000);
            }
        }

        function checkPasswordsMatch() {
            const password = document.getElementById('reg-password')?.value;
            const confirm = document.getElementById('reg-confirm')?.value;
            const errorDiv = document.getElementById('password-match-error');
            if (!password || !confirm) return false;
            if (password !== confirm) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Пароли не совпадают';
                return false;
            } else {
                errorDiv.style.display = 'none';
                return true;
            }
        }

        document.querySelectorAll('.password-toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const container = this.closest('.password_input_container');
                const input = container.querySelector('input');
                if (input.type === 'password') {
                    input.type = 'text';
                    this.innerHTML = '<i class="fas fa-eye"></i>';
                } else {
                    input.type = 'password';
                    this.innerHTML = '<i class="fas fa-eye-slash"></i>';
                }
            });
        });

        const password = document.getElementById('reg-password');
        const confirm = document.getElementById('reg-confirm');
        if (password && confirm) {
            password.addEventListener('input', checkPasswordsMatch);
            confirm.addEventListener('input', checkPasswordsMatch);
        }

        const form = document.getElementById('registrationForm');
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                e.stopImmediatePropagation();

                const username = document.getElementById('reg-username')?.value.trim();
                const lastName = document.getElementById('lastName')?.value.trim();
                const email = document.getElementById('email')?.value.trim();
                const password = document.getElementById('reg-password')?.value;
                const confirmPassword = document.getElementById('reg-confirm')?.value;

                if (!username || !lastName || !email || !password) {
                    showAlert('Заполните все поля', 'error');
                    return;
                }

                if (password !== confirmPassword) {
                    showAlert('Пароли не совпадают', 'error');
                    return;
                }

                if (password.length < 8) {
                    showAlert('Пароль должен содержать минимум 8 символов', 'error');
                    return;
                }

                const submitBtn = form.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Регистрация...';

                fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, lastName, email, password, confirmPassword })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.result) {
                        showAlert('Регистрация успешна! Проверьте почту для активации.', 'success');
                        setTimeout(() => {
                            if (window.App && App.switchTab) App.switchTab('login');
                        }, 2000);
                    } else {
                        showAlert(data.error || 'Ошибка регистрации', 'error');
                    }
                })
                .catch(err => {
                    console.error(err);
                    showAlert('Ошибка соединения с сервером', 'error');
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                });
            });
        }
    })();
</script>
</body>
</html>
