name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install local libs (morphology 1.5)
        run: |
          mvn install:install-file -Dfile=lib/dictionary-reader-1.5.jar -DpomFile=lib/dictionary-reader-1.5.pom
          mvn install:install-file -Dfile=lib/english-1.5.jar -DpomFile=lib/english-1.5.pom
          mvn install:install-file -Dfile=lib/morph-1.5.jar -DpomFile=lib/morph-1.5.pom
          mvn install:install-file -Dfile=lib/morphology-1.5.jar -DpomFile=lib/morphology-1.5.pom
          mvn install:install-file -Dfile=lib/russian-1.5.jar -DpomFile=lib/russian-1.5.pom

      - name: Build and test
        run: mvn clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for app to respond (up to 180s)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$code" = "200" ]; then
              echo "App is up after $((i*3))s (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i/60: HTTP $code, waiting 3s..."
            sleep 3
          done
          echo "App did not become ready in 180s"
          exit 1

      - name: "Smoke: GET / returns 200"
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "GET / -> $code"
          test "$code" = "200"

      - name: "Smoke: GET /api/statistics returns 401"
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/statistics)
          echo "GET /api/statistics -> $code"
          test "$code" = "401"

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v